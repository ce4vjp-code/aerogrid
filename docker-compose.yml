version: '3.8'

services:
  nodeodm:
    image: opendronemap/nodeodm:latest
    container_name: powerscan_nodeodm
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - nodeodm_data:/var/www/data

  ai-engine:
    build: ./PowerScan3D.AI
    container_name: powerscan_ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - C:/:/host_c:ro
      - ./:/app/workspace:ro
      - ./PowerScan3D.AI/main.py:/app/main.py
      - ./NEON.pt:/app/NEON.pt

volumes:
  nodeodm_data:



